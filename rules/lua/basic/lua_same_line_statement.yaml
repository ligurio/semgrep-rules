# Lua doesn't require the use of semicolons and doesn't
# automatically insert them at line breaks. When used wisely this
# results in code that is easy to read and understand, however it
# can cause subtle issues and hard to understand code when abused
# by using many different statements on the same line. This
# warning highlights cases where code should either be broken into
# multiple lines, or use `;` as a visual guide.
rules:
  - id: lua_same_line_statement
    metadata:
      author: Sergey Bronnikov <estetus@gmail.com>
      description: Same line statement.
    message: Same line statement.
    languages: [lua]
    severity: WARNING
    pattern-regex: '\bthen\b[^\n]*\b(local|return|break)\b'
