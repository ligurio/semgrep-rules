rules:
  - id: L1046
    metadata:
      author: Sergey Bronnikov <estetus@gmail.com>
      description: Writing to a file opened in read-only mode.
    message: |
      The file object "$FD" was opened in read mode, but is being
      written to. This will cause a runtime error.
    severity: ERROR
    languages: [lua]
    patterns:
      - pattern-inside: |
          $FD = io.open($NAME, $MODE)
          ...
      - pattern: $FD:write(...)
      - metavariable-pattern:
          metavariable: $MODE
          pattern-regex: "r"
