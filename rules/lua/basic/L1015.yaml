rules:
  - id: L1015
    metadata:
      author: Sergey Bronnikov <estetus@gmail.com>
      description: Compare float numbers.
      references:
        - http://lua-users.org/wiki/FloatingPoint
        - http://lua-users.org/lists/lua-l/2013-08/msg00159.html
        - https://stackoverflow.com/questions/12316769/how-safe-is-comparing-numbers-in-lua-with-equality-operator
        - https://floating-point-gui.de/errors/comparison/
    message:
      It is not possible to compare tables, threads and functions when
      "__eq" method is undefined.
    languages: [lua]
    severity: INFO
    pattern-either:
      - patterns:
          - pattern: $A == $B
          - metavariable-regex:
              metavariable: $A
              regex: '.*[0-9]+\.[0-9]+.*'
      - patterns:
          - pattern: $A == $B
          - metavariable-regex:
              metavariable: $B
              regex: '.*[0-9]+\.[0-9]+.*'
