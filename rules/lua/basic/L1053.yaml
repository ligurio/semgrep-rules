rules:
  - id: L1053
    metadata:
      author: Sergey Bronnikov <estetus@gmail.com>
      description: Non-initialized local.
    message: Non-initialized local.
    languages: [lua]
    severity: WARNING
    pattern-regex: '(?m)^[ \t]*local\s+[A-Za-z_]\w*[ \t]*(--.*)?$'

# It’s easy to forget to initialize a local variable and then proceed to use it
# regardless. This can happen due to a typo, or sometimes it can happen because
# the original variable definition is shadowed. When a local variable doesn’t
# have an initial value and is used without ever being assigned to, this warning
# is emitted:
