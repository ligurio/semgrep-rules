rules:
  - id: L1004
    metadata:
      author: Sergey Bronnikov <estetus@gmail.com>
      description: Using `#` for a table length.
      references:
        - https://www.lua.org/pil/19.1.html
    message: |
      Operator '#' could return a wrong length for sparse arrays. The length of
      a table `t` is defined to be any integer index `n` such that `t[n]` is not
      `nil` and `t[n+1]` is nil.
    languages: [lua]
    severity: WARNING
    pattern-either:
      - pattern: "#$T"
      - pattern: "# $T"
