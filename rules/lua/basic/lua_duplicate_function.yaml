rules:
  - id: lua_duplicate_function
    metadata:
      author: Sergey Bronnikov <estetus@gmail.com>
      description: Duplicate functions.
    message: Using unsafe function.
    # https://fuzz-introspector.readthedocs.io/en/latest/user-guides/analyse-sink-function.html
    languages: [lua]
    severity: WARNING
    pattern: |
      function $F(...) ... end
      ...
      function $F(...) ... end

# This warning is emitted when a script defines two functions with the same name
# in the same scope.

# The warning is not produced when the functions are defined in different scopes
# because this is much more likely to be intentional.
