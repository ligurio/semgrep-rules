# Lua syntax allows to use the same name for different parameters
# of a function as well as different local variables declared in
# the same statement. This is error prone, even if it's
# occasionally useful, so a warning is emitted in cases like this,
# unless the duplicate name is the placeholder `_`.
rules:
  - id: lua_duplicate_local
    metadata:
      author: Sergey Bronnikov <estetus@gmail.com>
      description: Duplicate locals.
    message: Duplicate locals.
    languages: [lua]
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern-regex: '(local\s+(?!_)(?P<A>\w+)\s*,\s*\w+\s*,\s*(?P=A)\s*=)|(function\s+[^(\s]+\s*\(\s*(?!_)(?P<B>\w+)\s*,\s*\w+\s*,\s*(?P=B)\s*\))'
          - pattern: function $O:$M(self) ... end
