rules:
  - id: lua_func_inside_func
    metadata:
      author: Sergey Bronnikov <estetus@gmail.com>
      description: A function is defined inside another function.
    message: |
      Function shouldn't  be declared inside functions.
    languages: [lua]
    severity: INFO
    patterns:
      - pattern-either:
          - pattern-inside: |
              function $NAME(...)
                ...
              end
          - pattern-inside: |
              $NAME = function(...)
                ...
              end
      - pattern-either:
          - pattern: local function $F(...) ... end
          - pattern: local $F = function(...) ... end
