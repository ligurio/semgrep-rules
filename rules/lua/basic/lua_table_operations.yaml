# To manipulate array-like tables, Lua provides a set of functions
# as part of the standard table library. To help use these
# functions correctly, this warning is emitted when one of these
# functions is used incorrectly or can be adjusted to be more
# performant.
#
# In addition, when type information is present, this warning will
# be emitted when `#` or `ipairs` is used on a table that has
# no numeric keys or indexers. This helps avoid common bugs like
# using `#t == 0` to check if a dictionary is empty.
rules:
  - id: lua_table_operations
    metadata:
      author: Sergey Bronnikov <estetus@gmail.com>
      description: Table operations.
    message: Table operations.
    languages: [lua]
    severity: WARNING
    pattern-either:
      - patterns:
          - pattern: table.insert($T, $IDX, ...)
          - metavariable-regex:
              metavariable: $IDX
              regex: '0'
      - patterns:
          - pattern: table.insert($T, $IDX, ...)
          - metavariable-regex:
              metavariable: $IDX
              regex: '.*#.*\+.*1.*'
