rules:
  - id: lua_multi_line_statement
    metadata:
      author: Sergey Bronnikov <estetus@gmail.com>
      description: Multiline statement.
    message: Multiline statement.
    # https://fuzz-introspector.readthedocs.io/en/latest/user-guides/analyse-sink-function.html
    languages: [lua]
    severity: WARNING
    pattern-regex: '[A-Za-z_][A-Za-z0-9_.]*\([^\n)]*\n'

# An opposite problem is having statements that span multiple lines. This is good
# for readability when the code is indented properly, but when it’s not it
# results in code that’s hard to understand, as its easy to confuse the next line
# for a separate statement.
