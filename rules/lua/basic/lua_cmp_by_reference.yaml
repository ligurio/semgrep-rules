rules:
  - id: lua_cmp_by_reference
    metadata:
      author: Sergey Bronnikov <estetus@gmail.com>
      description: Compare uncomparable.
      references:
        - https://www.lua.org/manual/5.3/manual.html#pdf-rawequal
    message:
      It is not possible to compare tables, threads and functions when
      "__eq", "__lt" and "le" methods are undefined.
    languages: [lua]
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern-inside: |
              $OBJ = function(...) ... end
              ...
          - pattern-inside: |
              local $OBJ = function(...) ... end
              ...
          - pattern-inside: |
              $OBJ = coroutine.create(...)
              ...
          - pattern-inside: |
              local $OBJ = coroutine.create(...)
              ...
      - pattern-either:
          - pattern: $OBJ == ...
          - pattern: ... == $OBJ
          - pattern: $OBJ ~= ...
          - pattern: ... ~= $OBJ
