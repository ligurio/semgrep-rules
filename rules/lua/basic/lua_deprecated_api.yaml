rules:
  - id: lua_deprecated_api
    metadata:
      author: Sergey Bronnikov <estetus@gmail.com>
      description: Using deprecated Lua function(s).
      references:
        - https://www.lua.org/manual/5.1/manual.html
        - https://www.lua.org/manual/5.2/manual.html
        - https://www.lua.org/manual/5.3/manual.html
        - https://www.lua.org/manual/5.4/manual.html
        - http://lua-users.org/wiki/CompatibilityWithLuaFive
        - https://wiki.gentoo.org/wiki/Lua/Porting_notes
    message: |
      Using of method or field that is marked as deprecated. Use
      of deprecated APIs is discouraged since they may have
      performance or correctness issues, may result in unexpected
      behavior, and could be removed in the future.
    languages: [lua]
    severity: WARNING
    pattern-either:
      # 5.1: Function string.gfind was renamed string.gmatch.
      - pattern: string.gfind(...)
      # 5.1: When string.gsub is called with a function as its
      # third argument, whenever this function returns nil or
      # false the replacement string is the whole match, instead
      # of the empty string.
      - pattern: string.gsub(...)
      # 5.1: Function table.setn was deprecated. Function
      # table.getn corresponds to the new length operator (#);
      # use the operator instead of the function.
      - pattern: table.setn(...)
      # 5.1: Function loadlib was renamed package.loadlib.
      - pattern: loadlib(...)
      # 5.1: Function math.mod was renamed math.fmod.
      - pattern: math.mod(...)
      # 5.1: Functions table.foreach and table.foreachi are
      # deprecated. You can use a `for` loop with `pairs` or
      # `ipairs` instead.
      - pattern: table.foreach(...)
      - pattern: table.foreachi(...)
      # 5.1: Function collectgarbage has different arguments.
      # Function gcinfo is deprecated; use collectgarbage("count")
      # instead.
      - pattern: gcinfo(...)
      # 5.2: Function module is deprecated.
      - pattern: module(...)
      # 5.2: Functions `setfenv` and `getfenv` were removed,
      # because of the changes in environments.
      - pattern: setfenv(...)
      - pattern: getfenv(...)
      # 5.2: Function math.log10 is deprecated. Use math.log with
      # 10 as its second argument, instead.
      - pattern: math.log10(...)
      # 5.2: Function `loadstring` is deprecated. Use `load`
      # instead; it now accepts string arguments and are exactly
      # equivalent to `loadstring`.
      - pattern: loadstring(...)
      # 5.2: Function `table.maxn` is deprecated.
      - pattern: table.maxn(...)
      # 5.2: Function os.execute now returns true when command
      # terminates successfully and nil plus error information
      # otherwise.
      # TODO
      # 5.2: Function `unpack` was moved into the table library
      # and therefore must be called as `table.unpack`.
      - pattern: unpack(...)
      # 5.2: Character class %z in patterns is deprecated, as now
      # patterns may contain '\0' as a regular character.
      # TODO
      # 5.2: The table `package.loaders` was renamed
      # `package.searchers`.
      - pattern: package.loaders(...)
      # 5.3: The bit32 library has been deprecated.
      - pattern: bit32.$FUNC(...)
      # 5.3: The ipairs iterator now respects metamethods and
      # its __ipairs metamethod has been deprecated.
      # TODO
      # 5.3: Option names in `io.read` do not have a starting '*'
      # anymore. For compatibility, Lua will continue to accept
      # (and ignore) this character.
      - pattern: io.read($PATH, $MODE)
      # 5.3: The following functions were deprecated in the
      # mathematical library: `atan2`, `cosh`, `sinh`, `tanh`,
      # `pow`, `frexp`, and `ldexp`. You can replace
      # `math.pow(x,y)` with `x ^ y`; you can replace
      # `math.atan2` with `math.atan`, which now accepts one or
      # two arguments; you can replace `math.ldexp(x, exp)` with
      # `x * 2.0^exp`. For the other operations, you can either
      # use an external library or implement them in Lua.
      - pattern: math.atan2(...)
      - pattern: math.cosh(...)
      - pattern: math.frexp(...)
      - pattern: math.ldexp(...)
      - pattern: math.pow(...)
      - pattern: math.sinh(...)
      - pattern: math.tanh(...)
      # 5.3: The call `collectgarbage("count")` now returns only
      # one result. (You can compute that second result from the
      # fractional part of the first result.)
      # TODO
      # 5.4: The function `print` does not call `tostring` to
      # format its arguments; instead, it has this functionality
      # hardwired. You should use `__tostring` to modify how
      # values are printed.
      # TODO
      # 5.4: The pseudo-random number generator used by the
      # function `math.random` now starts with a somewhat random
      # seed.
      # TODO
      # 5.4: By default, the decoding functions in the `utf8`
      # library do not accept surrogates as valid code points.
      # An extra parameter in these functions makes them more
      # permissive.
      # TODO
      # 5.4: The options "setpause" and "setstepmul" of the
      # function collectgarbage are deprecated. You should use
      # the new option "incremental" to set them.
      - pattern: collectgarbage("setpause")
      - pattern: collectgarbage("setstepmul")
      # 5.4: The function `io.lines` now returns four values,
      # instead of just one. That can be a problem when it is used
      # as the sole argument to another function that has optional
      # parameters, such as in `load(io.lines(filename, "L"))`.
      # To fix that issue, you can wrap the call into parentheses,
      # to adjust its number of results to one.
      # TODO
