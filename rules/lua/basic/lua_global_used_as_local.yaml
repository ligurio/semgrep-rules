rules:
  - id: lua_global_used_as_local
    metadata:
      author: Sergey Bronnikov <estetus@gmail.com>
      description: Global is used as a local.
    message: Global is used as a local.
    # https://fuzz-introspector.readthedocs.io/en/latest/user-guides/analyse-sink-function.html
    languages: [lua]
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern-inside: |
              function $NAME(...)
                ...
              end
          - pattern-inside: |
              local function $NAME(...)
                ...
              end
          - pattern-inside: |
              $NAME = function(...)
                ...
              end
      - pattern: $G = ...

# The UnknownGlobal lint can catch typos in globals that are read, but can’t
# catch them in globals that are assigned to. Because of this, and to discourage
# the use of globals in general, linter detects cases when a global is only used
# in one function and can be safely converted to a local variable. Note that in
# some cases this requires declaring the local variable in the beginning of the
# function instead of where it’s being assigned to.
