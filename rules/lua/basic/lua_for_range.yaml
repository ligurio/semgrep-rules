rules:
  - id: lua_for_range
    metadata:
      author: Sergey Bronnikov <estetus@gmail.com>
      description: Incorrect `for` bounds.
    message: Using unsafe function.
    # https://fuzz-introspector.readthedocs.io/en/latest/user-guides/analyse-sink-function.html
    languages: [lua]
    severity: WARNING
    pattern: |
      for $I = #$T, $END do
        ...
      end

# When using a numeric for, it’s possible to make various mistakes when
# specifying the for bounds. For example, to iterate through the table backwards,
# it’s important to specify the negative step size. This warning detects several
# cases where the numeric for only runs for 0 or 1 iterations, or when the step
# doesn’t divide the size of the range evenly.
