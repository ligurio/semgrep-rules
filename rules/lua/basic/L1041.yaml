rules:
  - id: L1041
    metadata:
      author: Sergey Bronnikov <estetus@gmail.com>
      description: Comparison precedence.
    message: Using unsafe function.
    # https://fuzz-introspector.readthedocs.io/en/latest/user-guides/analyse-sink-function.html
    languages: [lua]
    severity: WARNING
    pattern-either:
      - pattern: not $X == $Y
      - pattern: not $X ~= $Y
      - pattern: $A <= $B <= $C
      - pattern: $A >= $B >= $C

# Because of operator precedence rules, not X == Y parses as (not X) == Y;
# however, often the intent was to invert the result of the comparison. This
# warning flags erroneous conditions like that, as well as flagging cases where
# two comparisons happen in a row without any parentheses:
