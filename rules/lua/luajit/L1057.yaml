rules:
  - id: L1057
    metadata:
      author: Sergey Bronnikov <estetus@gmail.com>
      description: Using cdata object as a key in a table.
      references:
        - https://luajit.org/ext_ffi_semantics.html
    message: |
      Lua tables may be indexed by cdata objects, but this doesn't
      provide any useful semantics - cdata objects are unsuitable
      as table keys!
      A cdata object is treated like any other garbage-collected
      object and is hashed and compared by its address for table
      indexing. Since there's no interning for cdata value types,
      the same value may be boxed in different cdata objects with
      different addresses. Thus `t[1LL+1LL]` and `t[2LL]` usually
      do not point to the same hash slot and they certainly do not
      point to the same hash slot as `t[2]`.
    languages: [lua]
    severity: WARNING
    pattern-regex: '\[\s*(?:ffi\.new\s*\(|[0-9]+\s*(?:ULL|LL))'
