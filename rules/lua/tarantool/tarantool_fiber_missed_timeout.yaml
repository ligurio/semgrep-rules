rules:
  - id: tarantool_fiber_missed_timeout
    metadata:
      author: Sergey Bronnikov <estetus@gmail.com>
      description: Timeout is missed in a fiber method.
      references:
        - https://www.tarantool.io/en/doc/latest/reference/reference_capi/fiber/
    message: Все асинхронные вызовы должны иметь таймауты.
    languages: [lua]
    severity: WARNING
    pattern-either:
      - pattern: $F:join()
      - pattern: $CH:put($V)
      - pattern: $CH:get($V)
      - pattern: $C:wait()
