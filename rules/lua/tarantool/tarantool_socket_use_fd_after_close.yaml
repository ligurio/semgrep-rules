rules:
  - id: tarantool_socket_use_fd_after_close
    metadata:
      author: Sergey Bronnikov <estetus@gmail.com>
      description: Using socket handler after close.
      references:
        - https://www.tarantool.io/en/doc/latest/reference/reference_lua/socket/
    message: use_fd_after_close
    languages: [lua]
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern-inside: |
              $FD:close()
              ...
          - pattern-inside: |
              io.close($FD)
              ...
      - pattern: $FD:read(...)
      - pattern-not-inside: |
          $FD = ...
          $FD:read(...)
