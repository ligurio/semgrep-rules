rules:
  - id: T1026
    metadata:
      author: Sergey Bronnikov <estetus@gmail.com>
      description: Using deprecated Tarantool Lua function(s).
      references:
        # Deprecation of 'GT' iterator type for HASH index.
        - https://github.com/tarantool/tarantool/issues/7231
        # Option `sync` in `box.session.push()` is deprecated.
        - https://www.tarantool.io/en/doc/latest/reference/reference_lua/box_session/push/
        # `box.session.push` is deprecated.
        - https://github.com/tarantool/tarantool/issues/8802
        # box.cfg option `wal_cleanup_delay` is deprecated.
        - https://github.com/tarantool/doc/issues/4479
        # box.cfg option `election_fencing_enabled` is deprecated.
        - https://www.tarantool.io/en/doc/latest/reference/configuration/#confval-election_fencing_mode
        # The strategy "legacy" in box.cfg option
        # `bootstrap_strategy` is deprecated.
        - https://www.tarantool.io/en/doc/latest/reference/configuration/#confval-bootstrap_strategy
        # box.info.vinyl() is deprecated, use box.stat.vinyl() instead.
        - https://www.tarantool.io/en/doc/latest/reference/reference_lua/box_info/vinyl/
        # `space_object:auto_increment()` is deprecated since
        # version 1.7.5 - it is better to use a sequence.
        - https://www.tarantool.io/en/doc/latest/reference/reference_lua/box_space/auto_increment/
        # Since Tarantool version 1.7.7, ibuf_decode is deprecated.
        - https://www.tarantool.io/en/doc/latest/reference/reference_lua/buffer/#lua-function.buffer.ibuf
    message: |
      Using of method or field that is marked as deprecated. Use
      of deprecated APIs is discouraged since they may have
      performance or correctness issues, may result in unexpected
      behavior, and could be removed in the future.
    languages: [lua]
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: box.info.vinyl()
          - pattern: box.session.push(..., $SYNC)
          - pattern: box.session.push(...)
          - pattern: buffer.ibuf_decode(...)
          - pattern: $SPACE:select(..., {iterator = 'GT'})
          - pattern: box.space.$SPACE:auto_increment(...)
          - patterns:
              - pattern: box.cfg({$KEY = $VAL})
              - metavariable-regex:
                  metavariable: $KEY
                  regex: (bootstrap_strategy|election_fencing_enabled|election_fencing_mode|logger|logger_nonblock|panic_on_snap_error|panic_on_wal_error|replication_source|rows_per_wal|slab_alloc_arena|slab_alloc_maximal|slab_alloc_minimal|snap_dir|snapshot_count|snapshot_period|wal_cleanup_delay)
