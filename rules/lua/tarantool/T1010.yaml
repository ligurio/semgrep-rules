rules:
  - id: T1010
    metadata:
      author: Sergey Bronnikov <estetus@gmail.com>
      description: Insert a `nil` to a space.
      references:
        - https://www.tarantool.io/en/doc/latest/reference/reference_lua/box_space/insert/
    message: |
      Если необходимо вставить пустое значение в хранилище, надо
      использовать box.NULL, а не null.
    languages: [lua]
    severity: WARNING
    patterns:
      - pattern: nil
      - pattern-inside: $SPACE:insert(...)
