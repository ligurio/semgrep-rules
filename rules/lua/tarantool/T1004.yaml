rules:
  - id: T1004
    metadata:
      author: Sergey Bronnikov <estetus@gmail.com>
      description: Timeout is not set.
      references:
        - https://www.tarantool.io/en/doc/latest/reference/reference_capi/fiber/
        - https://www.tarantool.io/en/doc/latest/reference/reference_lua/net_box/
        - https://www.tarantool.io/en/doc/latest/reference/reference_lua/socket/
        - https://github.com/tarantool/vshard/issues/517
    message: |
      Все асинхронные вызовы должны иметь таймауты.
    languages: [lua]
    severity: WARNING
    pattern-either:
      - patterns:
          - pattern: $F:join()
          - pattern-either:
              - pattern-inside: |
                  $F = fiber.create(...)
                  ...
              - pattern-inside: |
                  $F = fiber.new(...)
                  ...
      - patterns:
          - pattern-either:
              - pattern: $CH:put($V)
              - pattern: $CH:get($V)
          - pattern-inside: |
              $CH = fiber.channel(...)
              ...
      - patterns:
          - pattern: $C:wait()
          - pattern-inside: |
              $C = fiber.cond()
              ...
      - patterns:
          - pattern-either:
              - pattern: $S:read($A)
              - pattern: $S:readable()
              - pattern: $S:writable()
              - pattern: $S:wait()
          - pattern-either:
              - pattern-inside: |
                  $S = socket.tcp_connect(...)
                  ...
              - pattern-inside: |
                  $S = socket.tcp_server(...)
                  ...
      - pattern: socket.tcp_connect($H, $P)
      - pattern: socket.getaddrinfo($H, $P, $O)
      - pattern: socket.tcp_server($H, $P, $O)
      - pattern: socket.iowait($A, $B)
      - pattern: vshard.router.bootstrap({if_not_bootstrapped = true})
      - pattern: vshard.router.call(100, {mode='write'}, $FUNC, args, {})
      - pattern: vshard.router.callro(100, $FUNC, args, {})
      - pattern: vshard.router.callrw(100, $FUNC, args, {})
      - pattern: vshard.router.callre(100, $FUNC, args, {})
      - pattern: vshard.router.callbro(100, $FUNC, args, {})
      - pattern: vshard.router.callbre(100, $FUNC, args, {})
      - pattern: vshard.router.map_callrw($FUNC, args, {})
      - patterns:
          - pattern-either:
              - pattern: $CONN = net_box.connect(...)
              - pattern: $CONN = net_box.new(...)
          - pattern-not-inside: |
              $CONN = ...
              ...
              $CONN:timeout(...)
          - pattern-not: $CONN = net_box.connect($URI, {connect_timeout = $T})
          - pattern-not: $CONN = net_box.new($URI, {connect_timeout = $T})
