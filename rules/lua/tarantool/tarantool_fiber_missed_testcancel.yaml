rules:
  - id: tarantool_fiber_missed_testcancel
    metadata:
      author: Sergey Bronnikov <estetus@gmail.com>
      description: Fiber method `:testcancel()` is missed.
      references:
        - https://www.tarantool.io/en/doc/latest/reference/reference_lua/fiber/#fiber-testcancel
        - https://confluence.vk.team/pages/viewpage.action?pageId=697245471
    message: |
      В функциях, которые выполняются внутри клиентских файберов, не
      присутствуют проверки fiber.testcancel.
    languages: [lua]
    severity: WARNING
    patterns:
      - pattern-either:
          - patterns:
              - pattern: fiber.new($F)
              - pattern-inside: |
                  $F = function(...)
                    ...
                  end
                  ...
                  fiber.new($F)
          - patterns:
              - pattern: fiber.new($F)
              - pattern-inside: |
                  local function $F(...)
                    ...
                  end
                  ...
                  fiber.new($F)
          - patterns:
              - pattern: fiber.create($F)
              - pattern-inside: |
                  $F = function(...)
                    ...
                  end
                  ...
                  fiber.create($F)
          - patterns:
              - pattern: fiber.create($F)
              - pattern-inside: |
                  local function $F(...)
                    ...
                  end
                  ...
                  fiber.create($F)
      - pattern-not-inside: |
          $F = function(...)
            ...
            fiber.testcancel()
            ...
          end
          ...
      - pattern-not-inside: |
          local function $F(...)
            ...
            fiber.testcancel()
            ...
          end
          ...
