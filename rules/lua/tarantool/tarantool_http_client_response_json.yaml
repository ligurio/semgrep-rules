rules:
  - id: tarantool_http_client_response_json
    metadata:
      author: Sergey Bronnikov <estetus@gmail.com>
      description: Method `:json()` can raise an error.
      references:
        - https://www.tarantool.io/en/doc/latest/reference/reference_lua/http/
    message: |
      response:json() должен быть обёрнут в pcall на случай пустого тела ответа.
    languages: [lua]
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern-inside: |
              $HTTP = require('http.client')
              ...
              $RESP = $HTTP.get(...)
              ...
          - pattern-inside: |
              $HTTP = require('http.client').new(...)
              ...
              $RESP = $HTTP.get(...)
              ...
      - pattern: $RESP:json(...)
      - pattern-not: pcall(...)
