rules:
  - id: T1014
    metadata:
      author: Sergey Bronnikov <estetus@gmail.com>
      description: Option `if_not_exists` is missed.
    message: if_not_exist
    languages: [lua]
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: box.schema.space.create(...)
          - pattern: box.schema.func.create(...)
          - pattern: $SPACE:create_index(...)
      - pattern-not: box.schema.space.create($N, { if_not_exists = true })
      - pattern-not: box.schema.space.create($N, { $K = $V, if_not_exists = true })
      - pattern-not: box.schema.space.create($N, { if_not_exists = true, $K = $V })
      - pattern-not: box.schema.func.create($N, { if_not_exists = true })
      - pattern-not: box.schema.func.create($N, { $K = $V, if_not_exists = true })
      - pattern-not: box.schema.func.create($N, { if_not_exists = true, $K = $V })
      - pattern-not: $S:create_index($N, { if_not_exists = true })
      - pattern-not: $S:create_index($N, { $K = $V, if_not_exists = true })
      - pattern-not: $S:create_index($N, { if_not_exists = true, $K = $V })
