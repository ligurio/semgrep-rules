rules:
  - id: tarantool_crypto_insecure_hash_algorithm
    metadata:
      author: Sergey Bronnikov <estetus@gmail.com>
      description: Using insecure hash algorithm.
      references:
        - https://www.tarantool.io/en/doc/latest/reference/reference_lua/crypto/
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
      cwe:
        - "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
    message: |
      Detected DES cipher algorithm which is insecure. The algorithm is
      considered weak and has been deprecated. Use AES instead.
    languages: [lua]
    severity: WARNING
    patterns:
      - pattern-inside: |
          $M = require("crypto")
          ...
      - pattern: $M.cipher.des.$MODE.encrypt(...)
    fix-regex:
      regex: des
      replacement: aes
