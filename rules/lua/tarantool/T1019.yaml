rules:
  - id: T1019
    metadata:
      author: Sergey Bronnikov <estetus@gmail.com>
      description: Using file descriptor after close.
      references:
        - https://www.tarantool.io/en/doc/latest/reference/reference_lua/fio/
        - https://www.tarantool.io/en/doc/latest/reference/reference_lua/popen/
        - https://www.tarantool.io/en/doc/latest/reference/reference_lua/socket/
    message: Use file descriptor after close.
    languages: [lua]
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern-inside: |
              $FD:close()
              ...
          - pattern-inside: |
              io.close($FD)
              ...
      - pattern: $FD:read(...)
      - pattern-not-inside: |
          $FD = ...
          $FD:read(...)
