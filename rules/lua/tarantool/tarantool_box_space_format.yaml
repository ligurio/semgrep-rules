rules:
  - id: tarantool_box_space_format
    metadata:
      author: Sergey Bronnikov <estetus@gmail.com>
      references:
        - https://www.tarantool.io/en/doc/latest/reference/reference_lua/box_schema/space_create/
    message: |
      Формат спейса "$NAME" определяется опцией при создании спейса.
      Используйте отдельный вызов `space:format()` для его задания.
    languages: [lua]
    severity: INFO
    pattern-either:
      - pattern: box.schema.space.create($N, { format = $F })
      - pattern: box.schema.space.create($N, { $K = $V, format = $F })
      - pattern: box.schema.space.create($N, { format = $F, $K = $V })
