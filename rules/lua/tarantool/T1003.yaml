rules:
  - id: T1003
    metadata:
      author: Sergey Bronnikov <estetus@gmail.com>
      description: A GC callback must not yield.
      references:
        - https://github.com/tarantool/tarantool/issues/6617
    message: A GC callback must not yield.
    languages: [lua]
    severity: ERROR
    patterns:
      - pattern-inside: |
          __gc = function(...)
            ...
          end
      - pattern-either:
          - pattern: fiber.yield(...)
          - pattern: fiber.sleep(...)
          - pattern: http.get(...)
          - pattern: http.post(...)
          - pattern: http.put(...)
          - pattern: http.delete(...)
          - pattern: http.request(...)
          - pattern: http.new(...)
