rules:
  - id: T1020
    metadata:
      author: Sergey Bronnikov <estetus@gmail.com>
      description: Writing to a file opened with read-only mode.
      references:
        - https://www.tarantool.io/en/doc/latest/reference/reference_lua/fio/
    message: |
      The file object "$FD" was opened in read mode, but is being
      written to. This will cause a runtime error.
    severity: ERROR
    languages: [lua]
    patterns:
      - pattern-inside: |
          $FD = fio.open($NAME, $MODE, ...)
          ...
      - metavariable-regex:
          metavariable: $MODE
          regex: ^['"]rb?['"]$
      - pattern: $FD:write(...)
