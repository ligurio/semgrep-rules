# Lua C API stack balance (forgotten pop), heuristic.
#
# A call that pushes a value onto the Lua stack is reported when
# it appears in a C function that returns 0 results and never
# consumes a value from the same lua_State. Note that the Lua VM
# discards everything left on the stack when a C function
# returns, so this is not a leak in the strict sense; the rule
# aims at stack-management mistakes (a value that was meant to
# be consumed or returned, but is silently dropped).
#
# Known false positives:
#  - a function that pushes a value only on one branch and
#    returns 0 on another;
#  - a consumer hidden behind a helper function call.

rules:
  - id: lua_push_without_pop
    metadata:
      author: Sergey Bronnikov <estetus@gmail.com>
      description: Lua C API pushes a value that is never consumed.
      confidence: LOW
      references:
        - https://www.lua.org/manual/5.4/manual.html#4.1.3
        - https://www.lua.org/manual/5.4/manual.html#lua_pop
    message: |
      This function pushes a value onto the Lua stack but returns 0 results and
      never consumes a value from the same `lua_State`. The pushed value is
      silently dropped when the C function returns, which usually means a
      missing `lua_pop`/setter/call or a wrong number of return values.
    languages:
      - c
      - cpp
    severity: WARNING
    patterns:
      - pattern: $P($L, ...)
      - metavariable-regex:
          metavariable: $P
          regex: '(lua_push|lua_getglobal|lua_gettable|lua_getfield|lua_geti|lua_getmetatable|lua_getuservalue|lua_getiuservalue|lua_getupvalue|lua_getlocal|lua_getinfo|lua_rawget|lua_new|lua_createtable|lua_load|luaL_load|luaL_newmetatable|luaL_requiref|luaL_where|luaL_traceback|luaL_gsub)'
      # Only functions that return no results are considered.
      - pattern-inside: |
          $RET $FUNC(...) {
            ...
            return 0;
            ...
          }
      # A consumer on the same lua_State anywhere in the
      # function suppresses the finding.
      - pattern-not:
          patterns:
            - pattern-inside: |
                $RET2 $FUNC2(...) {
                  ...
                  $C($L, ...);
                  ...
                }
            - metavariable-regex:
                metavariable: $C
                regex: '(lua_pop|lua_remove|lua_replace|lua_xmove|luaL_ref|lua_concat|lua_call|lua_pcall|lua_set|lua_rawset|lua_error|luaL_error|luaL_argerror)'
