# Usage of Lua C API functions that were deprecated, removed
# or replaced in later Lua versions. Such calls either fail to
# compile against a modern Lua or rely on compatibility macros
# that will eventually disappear, so port them to the current
# API.

rules:
  - id: lua_deprecated_c_api
    metadata:
      author: Sergey Bronnikov <estetus@gmail.com>
      description: Using deprecated Lua C API function(s).
      confidence: MEDIUM
      references:
        - https://www.lua.org/manual/5.1/manual.html
        - https://www.lua.org/manual/5.2/manual.html
        - https://www.lua.org/manual/5.3/manual.html
        - https://www.lua.org/manual/5.4/manual.html
        - http://lua-users.org/wiki/CompatibilityWithLuaFive
    message: |
      Using a Lua C API function that is deprecated or removed in
      recent Lua versions. Port the call to the current API, e.g.
      lua_rawlen/luaL_len instead of lua_objlen/lua_strlen,
      luaL_newlib/luaL_setfuncs instead of luaL_register,
      luaL_newstate instead of lua_open, lua_compare instead of
      lua_equal/lua_lessthan, lua_pcall instead of lua_cpcall,
      luaL_checkinteger/luaL_optinteger instead of
      luaL_checkint/luaL_checklong/luaL_optint/luaL_optlong,
      lua_newuserdatauv instead of lua_newuserdata, and
      lua_getiuservalue/lua_setiuservalue instead of
      lua_getuservalue/lua_setuservalue.
    languages:
      - c
      - cpp
    severity: WARNING
    pattern-either:
      - pattern: lua_objlen(...)
      - pattern: lua_strlen(...)
      - pattern: lua_getfenv(...)
      - pattern: lua_setfenv(...)
      - pattern: luaL_register(...)
      - pattern: lua_open()
      - pattern: lua_equal(...)
      - pattern: lua_lessthan(...)
      - pattern: lua_cpcall(...)
      - pattern: luaL_checkint(...)
      - pattern: luaL_checklong(...)
      - pattern: luaL_optint(...)
      - pattern: luaL_optlong(...)
      - pattern: luaL_typerror(...)
      - pattern: lua_pushunsigned(...)
      - pattern: lua_tounsigned(...)
      - pattern: luaL_checkunsigned(...)
      - pattern: luaL_optunsigned(...)
      - pattern: luaL_getn(...)
      - pattern: luaL_setn(...)
      - pattern: lua_setlevel(...)
      - pattern: lua_newuserdata(...)
      - pattern: lua_getuservalue(...)
      - pattern: lua_setuservalue(...)
      - pattern: lua_resetthread(...)
      - pattern: lua_gc($L, LUA_GCSETPAUSE, ...)
      - pattern: lua_gc($L, LUA_GCSETSTEPMUL, ...)
